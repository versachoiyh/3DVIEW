<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D VIEW</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff;color:#222}
#home{box-sizing:border-box;max-width:900px;margin:0 auto;padding:48px 24px}
h1{margin:0 0 8px;font-size:30px}
.sub{color:#777;margin-bottom:30px}
.card{display:block;border:1px solid #ddd;border-radius:12px;padding:18px 20px;margin:12px 0;text-decoration:none;color:#222;background:#fff}
.card:hover{background:#f7f7f7}
.card b{display:block;font-size:18px;margin-bottom:5px}
.card span{font-size:14px;color:#777}
#viewerPage{display:none;width:100%;height:100%}
#bar{height:54px;box-sizing:border-box;padding:0 18px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #e5e5e5;background:#fff}
#back{font-size:14px;text-decoration:none;color:#333}
#title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer{width:100%;height:calc(100% - 54px);background:#fff}
#msg{padding:30px;color:#555}
</style>
<script src="https://cdn.jsdelivr.net/npm/online-3d-viewer@0.18.0/build/engine/o3dv.min.js"></script>
</head>
<body>

<div id="home">
  <h1>3D VIEW</h1>
  <div class="sub">현장을 선택하세요.</div>

  <!-- 새 현장은 아래 한 줄을 복사해서 folder / title 만 바꾸면 됩니다. -->
  <a class="card" href="?folder=BANPO_PRUGIO&title=반포푸르지오 목공">
    <b>반포푸르지오 목공</b>
    <span>3D 작업지시서</span>
  </a>
</div>

<div id="viewerPage">
  <div id="bar">
    <a id="back" href="./">← 현장 목록</a>
    <div id="title">3D VIEW</div>
  </div>
  <div id="viewer"></div>
</div>

<script>
(async function () {
  const p = new URLSearchParams(location.search);
  const folder = p.get('folder');
  const customTitle = p.get('title') || '3D VIEW';

  if (!folder) return;

  document.getElementById('home').style.display = 'none';
  document.getElementById('viewerPage').style.display = 'block';
  document.getElementById('title').textContent = customTitle;
  document.title = customTitle;

  const owner = 'versachoiyh';
  const repo = '3DVIEW';
  const branch = 'main';
  const api = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(folder)}?ref=${branch}`;

  try {
    const res = await fetch(api);
    if (!res.ok) throw new Error('폴더를 찾을 수 없습니다.');
    const items = await res.json();

    const allowed = /\.(3ds|jpg|jpeg|png|bmp|gif|tga)$/i;
    const isMobile = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
    const MAX_MOBILE_TEXTURE_BYTES = 2 * 1024 * 1024;

    const fileItems = items.filter(x => x.type === 'file' && allowed.test(x.name));
    const files = fileItems.map(x => x.download_url);

    const model = files.find(x => /\.3ds$/i.test(x));
    if (!model) throw new Error('이 폴더에 3DS 파일이 없습니다.');

    // PC/iPad는 기존 그대로. 스마트폰만 큰 텍스처를 제외해 메모리 사용량을 줄입니다.
    // 3DS 안의 재질 이름과 같은 이미지 파일은 계속 자동으로 연결됩니다.
    const textureItems = fileItems.filter(x => !/\.3ds$/i.test(x.name));
    const mobileTextures = textureItems
      .filter(x => !x.size || x.size <= MAX_MOBILE_TEXTURE_BYTES)
      .map(x => x.download_url);
    const desktopTextures = textureItems.map(x => x.download_url);
    const ordered = [model, ...(isMobile ? mobileTextures : desktopTextures)];

    const viewer = new OV.EmbeddedViewer(document.getElementById('viewer'), {
      backgroundColor: new OV.RGBAColor(255,255,255,255),
      defaultColor: new OV.RGBColor(225,225,225),
      edgeSettings: new OV.EdgeSettings(true,new OV.RGBColor(45,45,45),1)
    });

    viewer.LoadModelFromUrlList(ordered);
  } catch (e) {
    document.getElementById('viewer').innerHTML =
      `<div id="msg"><b>불러오지 못했습니다.</b><br><br>${e.message}<br><br>GitHub의 ${folder} 폴더 안에 3DS와 텍스처 파일이 있는지 확인하세요.</div>`;
  }
})();
</script>
</body>
</html>
